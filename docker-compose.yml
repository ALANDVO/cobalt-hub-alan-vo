# Cobalt Hub - Docker Compose for Development
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cobalt-hub-backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - APP_NAME=Cobalt Hub
      - APP_VERSION=1.0.0
      - DEBUG=true
      - ENVIRONMENT=development
      - DATABASE_URL=sqlite+aiosqlite:///./data/cobalt_hub.db
      - OIDC_ENABLED=true
      - OIDC_ISSUER_URL=http://keycloak:8080/realms/cobalt-hub
      - OIDC_CLIENT_ID=cobalt-hub-backend
      - OIDC_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET:-}
      - OIDC_AUDIENCE=cobalt-hub-api
      - OIDC_JWKS_URL=http://keycloak:8080/realms/cobalt-hub/protocol/openid-connect/certs
      - CORS_ORIGINS=["http://127.0.0.1:5173","http://localhost:5173"]
      - DEMO_MODE=true
      - DEMO_USER_ID=demo-user
      - DEMO_USER_ROLES=["viewer","operator"]
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_PROVIDER=openai-compatible
      - LLM_MODEL=gpt-4o-mini
      - LLM_BASE_URL=${LLM_BASE_URL:-}
    volumes:
      - backend_data:/app/data
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cobalt-hub-frontend
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      - VITE_API_URL=http://127.0.0.1:8000/api
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5173/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: cobalt-hub-keycloak
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HOSTNAME=localhost
      - KC_HTTP_ENABLED=true
    command: start-dev --import-realm
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  backend_data:
  keycloak_data: